# Evita que Supabase pause el proyecto gratuito por inactividad
# (se pausa tras ~1 semana con poca actividad en la base).
# Secrets necesarios: SUPABASE_URL, SUPABASE_ANON_KEY
name: Mantener Supabase activo

on:
  schedule:
    - cron: "23 13 */2 * *"   # cada 2 días, 10:23 hora de Argentina
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la base
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          curl --fail --silent --show-error -X POST \
            "$SUPABASE_URL/rest/v1/rpc/info_negocio" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' > /dev/null
          echo "Supabase respondió correctamente"
